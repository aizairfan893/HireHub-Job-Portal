<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireHub Job Portal</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script defer src="app.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            background: linear-gradient(135deg,#04070c,#1e1b4b,#6763cb,#7c3aed);
            color:rgb(199, 113, 172);
            padding:30px;
        }

        /* ================= HEADER ================= */

        .main-title{
            text-align:center;
            margin-bottom:40px;
        }

        .main-title h1{
            font-size:55px;
            font-weight:700;
            margin-bottom:10px;
        }

        .main-title p{
            color:#ab2ece;
            font-size:18px;
        }

        /* ================= GLASS BOX ================= */

        .box{
            background: rgba(95, 231, 172, 0.08);
            border:1px solid rgba(108, 196, 64, 0.1);
            backdrop-filter: blur(15px);
            border-radius:20px;
            padding:25px;
            margin-bottom:30px;
            box-shadow:0 8px 30px rgba(57, 164, 27, 0.3);
        }

        /* ================= INPUTS ================= */

        .form-control{
            background: rgba(255,255,255,0.12);
            border:none;
            border-radius:14px;
            padding:14px;
            color:rgb(227, 84, 84);
        }

        .form-control::placeholder{
            color:rgba(21, 193, 212, 0.7);
        }

        .form-control:focus{
            background: rgba(255,255,255,0.18);
            color:rgb(21, 141, 193);
            box-shadow:none;
            border:1px solid #000000;
        }

        /* ================= JOB CARD ================= */

        .job{
            background: rgba(43, 161, 171, 0.08);
            border:1px solid rgba(15, 176, 55, 0.1);
            backdrop-filter: blur(12px);
            border-radius:18px;
            padding:20px;
            margin-bottom:20px;
            transition:0.3s;
        }

        .job:hover{
            transform:translateY(-5px);
            box-shadow:0 10px 25px rgba(190, 47, 176, 0.35);
        }

        .job h4{
            color:#f4f018;
            font-weight:600;
        }

        .job p{
            color:#cc4be3;
        }

        /* ================= BUTTONS ================= */

        .btn{
            border:none;
            border-radius:12px;
            padding:10px 18px;
            font-weight:500;
            transition:0.3s;
        }

        .btn-success{
            background: linear-gradient(90deg,#10b981,#22c55e);
        }

        .btn-success:hover{
            transform:scale(1.05);
        }

        .btn-primary{
            background: linear-gradient(90deg,#06b6d4,#3b82f6);
        }

        .btn-primary:hover{
            transform:scale(1.05);
        }

        .btn-danger{
            background: linear-gradient(90deg,#ef4444,#dc2626);
        }

        .btn-warning{
            background: linear-gradient(90deg,#f59e0b,#000000);
            color:white;
        }

        .btn-info{
            background: linear-gradient(90deg,#8b5cf6,#6366f1);
            color:white;
        }

        /* ================= TOTAL JOBS ================= */

        .stats{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-bottom:40px;
            flex-wrap:wrap;
        }

        .stat-box{
            width:220px;
            background: rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius:20px;
            padding:25px;
            text-align:center;
        }

        .stat-box h2{
            font-size:40px;
            color:#38bdf8;
        }

        /* ================= SECTION TITLES ================= */

        h3,h4{
            margin-bottom:20px;
            font-weight:600;
        }

        /* ================= FILE INPUT ================= */

        input[type="file"]{
            background: rgba(255,255,255,0.12);
            color:white;
            border:none;
            padding:12px;
            border-radius:12px;
        }

        /* ================= HR ================= */

        hr{
            border:1px solid rgba(255,255,255,0.15);
            margin:40px 0;
        }

        /* ================= SCROLLBAR ================= */

        ::-webkit-scrollbar{
            width:10px;
        }

        ::-webkit-scrollbar-track{
            background:#111827;
        }

        ::-webkit-scrollbar-thumb{
            background:#8b5cf6;
            border-radius:20px;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:768px){

            body{
                padding:15px;
            }

            .main-title h1{
                font-size:36px;
            }

            .box{
                padding:18px;
            }

            .job{
                padding:15px;
            }

            .btn{
                width:100%;
                margin-top:10px;
            }
        }

    </style>

</head>

<body>

    <!-- ================= HEADER ================= -->

    <div class="main-title">
        <h1>🚀 HireHub</h1>
        <p>Find your dream jobs & hire smart talent</p>
    </div>


    <!-- ================= DASHBOARD ================= -->

    <div class="stats">

        <div class="stat-box">
            <h2 id="totalJobs">0</h2>
            <p>Total Jobs</p>
        </div>

        <div class="stat-box">
            <h2>24+</h2>
            <p>Companies</p>
        </div>

        <div class="stat-box">
            <h2>120+</h2>
            <p>Applications</p>
        </div>

    </div>


    <!-- ================= ADMIN PANEL ================= -->

    <div class="box">

        <h3><i class="fa-solid fa-briefcase"></i> Add Job (Admin)</h3>

        <input id="title"
            class="form-control mb-3"
            placeholder="Job Title">

        <input id="company"
            class="form-control mb-3"
            placeholder="Company Name">

        <input id="location"
            class="form-control mb-3"
            placeholder="Location">

        <input id="salary"
            class="form-control mb-3"
            placeholder="Salary">

        <textarea
            id="description"
            class="form-control mb-3"
            placeholder="Job Description"
            rows="4"></textarea>

        <button
            onclick="addJob()"
            class="btn btn-success w-100">
            <i class="fa-solid fa-plus"></i>
            Post Job
        </button>

    </div>


    <!-- ================= JOB LIST ================= -->

    <div class="box">

        <h3>
            <i class="fa-solid fa-layer-group"></i>
            Available Jobs
        </h3>

        <div id="jobList"></div>

    </div>


    <!-- ================= APPLICATIONS ================= -->

    <div class="box">

        <h3>
            <i class="fa-solid fa-users"></i>
            Job Applications
        </h3>

        <div id="applicationList"></div>

    </div>


    <!-- ================= APPLY FORM ================= -->

    <div class="box">

        <h3>
            <i class="fa-solid fa-paper-plane"></i>
            Apply For Job
        </h3>

        <input
            type="text"
            id="userName"
            class="form-control mb-3"
            placeholder="Your Name"
        >

        <input
            type="email"
            id="userEmail"
            class="form-control mb-3"
            placeholder="Your Email"
        >

        <input
            type="text"
            id="userSkills"
            class="form-control mb-3"
            placeholder="Your Skills"
        >

        <input
            type="file"
            id="resume"
            class="form-control mb-3"
        >

    </div>

</body>
</html>
